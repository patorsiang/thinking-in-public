<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" role="img" aria-label="A big agent writes a skill and a hook. A small agent does the task. The hook checks the result. If it passes, the task is done. If it fails, the big agent runs a retrospective and writes a new skill and hook, which the small agent uses next round.">
<defs>
<marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B6A63"/></marker>
<marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B4531F"/></marker>
</defs>
<rect width="1300" height="560" rx="24" fill="#F6F4EE"/>
<text x="40" y="60" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#14181F">The skill and hook loop</text>
<text x="40" y="92" font-family="system-ui, sans-serif" font-size="20" fill="#4F5864">From the Agent Skills talk, generated with Claude from my notes and photos.</text>
<g font-family="system-ui, sans-serif" font-size="22" text-anchor="middle" fill="#14181F">
<rect x="40" y="150" width="230" height="100" rx="14" fill="#E7E3D6" stroke="#B9B3A0" stroke-width="2"/>
<text x="155" y="196" font-weight="700">Big agent</text>
<text x="155" y="224">(strong model)</text>
<rect x="340" y="150" width="270" height="100" rx="14" fill="#0F7B6C"/>
<text x="475" y="196" fill="#FFFFFF" font-weight="700">SKILL.md + hook</text>
<text x="475" y="224" fill="#FFFFFF">how + checkpoint</text>
<rect x="680" y="150" width="260" height="100" rx="14" fill="#E7E3D6" stroke="#B9B3A0" stroke-width="2"/>
<text x="810" y="196" font-weight="700">Small agent</text>
<text x="810" y="224">(fast, low effort)</text>
<rect x="680" y="340" width="260" height="100" rx="14" fill="#0F7B6C" fill-opacity="0.85"/>
<text x="810" y="402" fill="#FFFFFF" font-weight="700">Hook checks result</text>
<rect x="1010" y="340" width="230" height="100" rx="14" fill="#E7E3D6" stroke="#B9B3A0" stroke-width="2"/>
<text x="1125" y="402" font-weight="700">Done</text>
<rect x="340" y="340" width="270" height="100" rx="14" fill="#E7E3D6" stroke="#B4531F" stroke-width="2"/>
<text x="475" y="386" font-weight="700">Retrospective</text>
<text x="475" y="414">by the big agent</text>
</g>
<g stroke="#6B6A63" stroke-width="3" marker-end="url(#c)">
<line x1="272" y1="200" x2="336" y2="200"/>
<line x1="612" y1="200" x2="676" y2="200"/>
<line x1="810" y1="252" x2="810" y2="336"/>
<line x1="942" y1="390" x2="1006" y2="390"/>
</g>
<g stroke="#B4531F" stroke-width="3" marker-end="url(#d)">
<line x1="678" y1="390" x2="614" y2="390"/>
<line x1="475" y1="338" x2="475" y2="254"/>
</g>
<g font-family="system-ui, sans-serif" font-size="20" fill="#4F5864">
<text x="974" y="372" text-anchor="middle">pass</text>
<text x="646" y="372" text-anchor="middle" fill="#B4531F">fail</text>
<text x="490" y="300" fill="#B4531F">new skill and hook</text>
</g>
<text x="40" y="510" font-family="system-ui, sans-serif" font-size="20" fill="#4F5864">The next round reuses the improved skill and hook, so the small agent needs less help.</text>
</svg>
