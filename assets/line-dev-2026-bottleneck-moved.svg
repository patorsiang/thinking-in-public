<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Two rows of boxes. Before: write code is the widest step, then review, then ship. With agents: write code is narrow, review is the widest step, followed by handoffs and agreeing what done means.">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B6A63"/></marker>
</defs>
<rect width="1200" height="500" rx="24" fill="#F6F4EE"/>
<text x="40" y="60" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#14181F">Where the effort goes</text>
<text x="40" y="92" font-family="system-ui, sans-serif" font-size="20" fill="#4F5864">Box width = effort. An illustration of the theme across the talks, not measured data.</text>
<text x="40" y="190" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#14181F">Before</text>
<g font-family="system-ui, sans-serif" font-size="22" text-anchor="middle" fill="#14181F">
<rect x="200" y="140" width="420" height="90" rx="14" fill="#E7E3D6" stroke="#B9B3A0" stroke-width="2"/>
<text x="410" y="192">Write code</text>
<rect x="670" y="140" width="170" height="90" rx="14" fill="#E7E3D6" stroke="#B9B3A0" stroke-width="2"/>
<text x="755" y="192">Review</text>
<rect x="890" y="140" width="130" height="90" rx="14" fill="#E7E3D6" stroke="#B9B3A0" stroke-width="2"/>
<text x="955" y="192">Ship</text>
</g>
<g stroke="#6B6A63" stroke-width="3" marker-end="url(#a)">
<line x1="622" y1="185" x2="666" y2="185"/>
<line x1="842" y1="185" x2="886" y2="185"/>
</g>
<text x="40" y="380" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#14181F">With agents</text>
<g font-family="system-ui, sans-serif" font-size="22" text-anchor="middle" fill="#14181F">
<rect x="200" y="330" width="140" height="100" rx="14" fill="#E7E3D6" stroke="#B9B3A0" stroke-width="2"/>
<text x="270" y="386">Write code</text>
<rect x="385" y="330" width="320" height="100" rx="14" fill="#0F7B6C"/>
<text x="545" y="386" fill="#FFFFFF" font-weight="700">Review</text>
<rect x="750" y="330" width="190" height="100" rx="14" fill="#0F7B6C" fill-opacity="0.85"/>
<text x="845" y="386" fill="#FFFFFF" font-weight="700">Handoffs</text>
<rect x="985" y="330" width="190" height="100" rx="14" fill="#0F7B6C" fill-opacity="0.7"/>
<text x="1080" y="373" fill="#FFFFFF" font-weight="700">Agree what</text>
<text x="1080" y="401" fill="#FFFFFF" font-weight="700">“done” means</text>
</g>
<g stroke="#6B6A63" stroke-width="3" marker-end="url(#a)">
<line x1="342" y1="380" x2="381" y2="380"/>
<line x1="707" y1="380" x2="746" y2="380"/>
<line x1="942" y1="380" x2="981" y2="380"/>
</g>
</svg>
